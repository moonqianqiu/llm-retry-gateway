name: CI

on:
  push:
    branches: [master]
    tags-ignore: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # 纯标准库项目无 go.sum，缓存反而报错
      - name: Verify
        shell: bash
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files need gofmt:"
            gofmt -l .
            exit 1
          fi
          go vet ./...
          go test ./... -count=1
