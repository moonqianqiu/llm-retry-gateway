name: CI

on:
  push:
    branches: [master]
    tags-ignore: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify
        shell: bash
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files need gofmt:"
            gofmt -l .
            exit 1
          fi
          go vet ./...
          go test ./... -count=1
